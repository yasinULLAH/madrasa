<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasa School Management - Yasin Ullah</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <style>
      :root {
        --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        --fs: 15px;
        --hbg: #0f766e;
        --ht: #fff;
        --fbg: #0f172a;
        --ft: #fff;
        --sbg: #fff;
        --st: #0f172a;
        --mbg: #f7faf8;
        --mt: #102a27;
        --gold: #d4af37
      }

      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--mbg);
        color: var(--mt);
        font-family: var(--font);
        font-size: var(--fs)
      }

      button,
      input,
      select,
      textarea {
        font: inherit
      }

      input,
      select,
      textarea {
        min-height: 44px
      }

      .app-header {
        background: var(--hbg);
        color: var(--ht)
      }

      .app-footer {
        background: var(--fbg);
        color: var(--ft)
      }

      .app-sidebar {
        background: var(--sbg);
        color: var(--st)
      }

      .card {
        background: #ffffffe8;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        box-shadow: 0 18px 45px #0f172a14
      }

      .btn {
        min-height: 44px;
        border-radius: .9rem;
        padding: .7rem 1rem;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        transition: .16s
      }

      .btn:active {
        transform: scale(.98)
      }

      .btn-primary {
        background: #0f766e;
        color: #fff;
        box-shadow: 0 12px 24px #0f766e33
      }

      .btn-primary:hover {
        background: #115e59
      }

      .btn-soft {
        background: #fff;
        border: 1px solid #cbd5e1;
        color: #0f172a
      }

      .btn-soft:hover {
        background: #f8fafc
      }

      .btn-danger {
        background: #dc2626;
        color: #fff
      }

      .nav-link {
        min-height: 44px;
        border-radius: 1rem;
        padding: .75rem .9rem;
        display: flex;
        align-items: center;
        gap: .75rem;
        transition: .16s
      }

      .nav-link:hover,
      .nav-link.active {
        background: #0f766e1a;
        color: #0f766e
      }

      .form-input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: .9rem;
        background: #fff;
        color: #0f172a;
        padding: .7rem .85rem
      }

      .form-input:focus {
        outline: 0;
        border-color: #14b8a6;
        box-shadow: 0 0 0 4px #14b8a629
      }

      label {
        font-weight: 800;
        color: #334155
      }

      .grid-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff
      }

      .badge {
        display: inline-flex;
        border-radius: 999px;
        padding: .25rem .65rem;
        font-size: .78rem;
        font-weight: 900
      }

      .green {
        background: #dcfce7;
        color: #166534
      }

      .red {
        background: #fee2e2;
        color: #991b1b
      }

      .yellow {
        background: #fef3c7;
        color: #92400e
      }

      .blue {
        background: #dbeafe;
        color: #1e40af
      }

      .slate {
        background: #f1f5f9;
        color: #334155
      }

      .dataTables_wrapper {
        padding: 1rem
      }

      .dataTables_wrapper input,
      .dataTables_wrapper select {
        min-height: 42px;
        border: 1px solid #cbd5e1;
        border-radius: .7rem;
        padding: .45rem
      }

      .dt-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem
      }

      .dt-button {
        border-radius: .75rem !important;
        border: 1px solid #cbd5e1 !important;
        background: #fff !important;
        font-weight: 800 !important
      }

      .select2-container {
        width: 100% !important
      }

      .select2-container .select2-selection--single,
      .select2-container .select2-selection--multiple {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: .9rem;
        display: flex;
        align-items: center
      }

      .modal-bg {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: #0f172a99;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem
      }

      .modal-card {
        width: min(1000px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: #fff;
        border-radius: 1.25rem;
        box-shadow: 0 30px 80px #0006
      }

      .mobile-nav {
        transition: .2s;
        box-shadow: 0 -16px 35px #0f172a24
      }

      .mobile-nav.hide {
        transform: translateY(115%)
      }

      .auth-bg {
        background: radial-gradient(circle at top left, #0f766e40, transparent 34%), radial-gradient(circle at bottom right, #d4af3740, transparent 34%), linear-gradient(135deg, #ecfdf5, #fff, #fffbeb)
      }

      .print-title {
        text-align: center;
        font-size: 24px;
        font-weight: 900
      }

      .print-sub {
        text-align: center;
        font-size: 13px;
        color: #334155;
        margin-bottom: 16px
      }

      .print-foot {
        border-top: 1px solid #cbd5e1;
        margin-top: 24px;
        padding-top: 10px;
        text-align: center;
        font-size: 12px;
        color: #334155
      }

      @media(max-width:767px) {
        .dataTables_wrapper .dataTables_filter input {
          width: 100%;
          margin: 0
        }

        .dt-button {
          flex: 1
        }

        .card {
          border-radius: 1rem
        }
      }

      @media print {
        body>*:not(#printArea) {
          display: none !important
        }

        #printArea {
          display: block !important;
          background: #fff;
          color: #000
        }

        table {
          border-collapse: collapse !important;
          width: 100% !important
        }

        th,
        td {
          border: 1px solid #555 !important;
          padding: 6px !important
        }

        tr {
          page-break-inside: avoid !important
        }

        .no-print {
          display: none !important
        }
      }

      #printArea:empty,
      #modal:empty {
        display: none
      }

      [dir=rtl] .nav-link,
      [dir=rtl] .btn {
        flex-direction: row-reverse
      }

      [dir=rtl] .select2-selection__rendered {
        text-align: right !important
      }

      .nav-item {
        min-height: 44px;
        border-radius: 1rem;
        padding: .75rem .9rem;
        display: flex;
        align-items: center;
        gap: .75rem;
        transition: .16s;
        text-align: left;
        font-weight: 800
      }

      .nav-item:hover,
      .nav-item.active {
        background: #0f766e1a;
        color: #0f766e
      }

      .chartbox {
        height: 320px;
        min-height: 260px
      }

      #modal:not(:empty) {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: #0f172a99
      }

      .modal-card {
        position: relative;
        z-index: 1
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal"></div>
    <div id="printArea"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/just-validate@4.3.0/dist/just-validate.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
    <script>
      (() => {
        'use strict';
        const C = {
          db: 'bss_madrasa_indexeddb_v1',
          ver: 1,
          tz: 'Asia/Karachi',
          idle: 2400000,
          abs: 28800000,
          imgMax: 204800,
          author: {
            name: 'Yasin Ullah',
            company: 'Bannu Software Solutions',
            site: 'https://www.yasinbss.com',
            whatsapp: '03361593533'
          },
          sp: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/
        };
        const stores = ['meta', 'users', 'settings', 'themes', 'audit', 'students', 'teachers', 'classes', 'feePlans', 'feePayments', 'salaryPayments', 'attendance', 'staffAttendance', 'exams', 'timetable', 'expenses', 'inventory'];
        const cfg = {
          meta: ['key'],
          settings: ['key'],
          users: ['id', 1],
          themes: ['id', 1],
          audit: ['id', 1],
          students: ['id', 1],
          teachers: ['id', 1],
          classes: ['id', 1],
          feePlans: ['id', 1],
          feePayments: ['id', 1],
          salaryPayments: ['id', 1],
          attendance: ['id', 1],
          staffAttendance: ['id', 1],
          exams: ['id', 1],
          timetable: ['id', 1],
          expenses: ['id', 1],
          inventory: ['id', 1]
        };
        let db, user, session, settings, theme, mod = 'dashboard',
          dirty = false,
          timer = null,
          charts = {},
          lastY = 0;
        const $ = s => document.querySelector(s),
          $$ = s => Array.from(document.querySelectorAll(s)),
          app = () => $('#app'),
          main = () => $('#main'),
          M = () => $('#modal'),
          P = () => $('#printArea'),
          now = () => new Date().toISOString(),
          today = () => now().slice(0, 10),
          month = () => now().slice(0, 7),
          esc = v => String(v ?? '').replace(/[&<>'"]/g, x => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          } [x])),
          num = v => Number(String(v ?? '').replace(/,/g, '')) || 0,
          money = v => 'Rs ' + num(v).toLocaleString('en-PK'),
          date = v => v ? new Date(v + 'T00:00:00').toLocaleDateString(document.documentElement.lang === 'ur' ? 'ur-PK' : 'en-PK', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          }) : '',
          dt = v => v ? new Date(v).toLocaleString('en-PK', {
            dateStyle: 'medium',
            timeStyle: 'short'
          }) : '',
          ml = v => v ? new Date(v + '-01T00:00:00').toLocaleDateString('en-PK', {
            month: 'short',
            year: 'numeric'
          }) : '',
          id = p => p + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        const roles = {
          admin: ['*'],
          teacher: ['dashboard', 'students', 'classes', 'attendance', 'exams', 'timetable', 'reports', 'settings.profile', 'settings.theme', 'staffAttendance'],
          standard: ['dashboard', 'students', 'classes', 'feeCollection', 'reports', 'settings.profile', 'settings.theme']
        };
        const nav = [
          ['dashboard', 'Dashboard', 'ڈیش بورڈ', 'fa-chart-line'],
          ['students', 'Students', 'طلبہ', 'fa-user-graduate'],
          ['teachers', 'Teachers', 'اساتذہ', 'fa-chalkboard-user'],
          ['classes', 'Classes', 'جماعتیں', 'fa-school'],
          ['fees', 'Fee Structures', 'فیس', 'fa-tags'],
          ['feeCollection', 'Fee Collection', 'وصولی', 'fa-receipt'],
          ['payroll', 'Payroll', 'تنخواہیں', 'fa-money-check-dollar'],
          ['attendance', 'Attendance', 'حاضری', 'fa-clipboard-check'],
          ['exams', 'Exams', 'امتحان', 'fa-file-pen'],
          ['timetable', 'Timetable', 'اوقات', 'fa-calendar-days'],
          ['expenses', 'Expenses', 'اخراجات', 'fa-wallet'],
          ['inventory', 'Inventory', 'سامان', 'fa-boxes-stacked'],
          ['staffAttendance', 'Staff Attendance', 'عملہ', 'fa-user-clock'],
          ['reports', 'Reports', 'رپورٹس', 'fa-chart-pie'],
          ['settings', 'Settings', 'ترتیبات', 'fa-gear']
        ];

        function ok(p) {
          return user && ((roles[user.role] || []).includes('*') || (roles[user.role] || []).includes(p) || p === 'settings')
        }

        function canAdmin() {
          return user && user.role === 'admin'
        }

        function toast(icon, title) {
          Swal.fire({
            toast: true,
            position: 'top-end',
            timer: 3000,
            timerProgressBar: true,
            showConfirmButton: false,
            icon,
            title,
            customClass: {
              popup: 'rounded-2xl'
            }
          })
        }
        async function ask(title, text, txt = 'Delete') {
          return (await Swal.fire({
            title,
            text,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: txt,
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#dc2626',
            reverseButtons: true,
            customClass: {
              popup: 'rounded-2xl'
            }
          })).isConfirmed
        }

        function loadBtn(b, t = 'Processing...') {
          if (!b) return () => {};
          const h = b.innerHTML;
          b.disabled = true;
          b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>' + esc(t) + '</span>';
          return () => {
            b.disabled = false;
            b.innerHTML = h
          }
        }

        function req(r) {
          return new Promise((res, rej) => {
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error)
          })
        }

        function tx(t) {
          return new Promise((res, rej) => {
            t.oncomplete = res;
            t.onerror = () => rej(t.error);
            t.onabort = () => rej(t.error)
          })
        }

        function openDB() {
          return new Promise((res, rej) => {
            let r = indexedDB.open(C.db, C.ver);
            r.onupgradeneeded = e => {
              let d = e.target.result;
              stores.forEach(s => {
                if (!d.objectStoreNames.contains(s)) {
                  let c = cfg[s],
                    o = d.createObjectStore(s, {
                      keyPath: c[0],
                      autoIncrement: !!c[1]
                    });
                  if (s === 'users') o.createIndex('email', 'email', {
                    unique: true
                  });
                  if (s === 'students') {
                    o.createIndex('enroll', 'enroll', {
                      unique: true
                    });
                    o.createIndex('classId', 'classId')
                  }
                  if (s === 'classes') o.createIndex('name', 'name', {
                    unique: true
                  });
                  if (s === 'attendance') o.createIndex('classDate', ['classId', 'date'], {
                    unique: true
                  });
                  if (s === 'staffAttendance') o.createIndex('date', 'date', {
                    unique: true
                  })
                }
              })
            };
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error)
          })
        }
        async function all(s) {
          return req(db.transaction(s, 'readonly').objectStore(s).getAll())
        }
        async function one(s, k) {
          return req(db.transaction(s, 'readonly').objectStore(s).get(k))
        }
        async function idx(s, i, k) {
          return req(db.transaction(s, 'readonly').objectStore(s).index(i).get(k))
        }
        async function idxAll(s, i, k) {
          return req(db.transaction(s, 'readonly').objectStore(s).index(i).getAll(k))
        }
        async function put(s, v) {
          let t = db.transaction(s, 'readwrite');
          let r = await req(t.objectStore(s).put(v));
          await tx(t);
          return r
        }
        async function del(s, k) {
          let t = db.transaction(s, 'readwrite');
          t.objectStore(s).delete(k);
          await tx(t)
        }
        async function clr(s) {
          let t = db.transaction(s, 'readwrite');
          t.objectStore(s).clear();
          await tx(t)
        }
        async function bulk(s, a) {
          let t = db.transaction(s, 'readwrite'),
            o = t.objectStore(s);
          a.forEach(x => o.put(x));
          await tx(t)
        }
        async function sha(t) {
          let b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
          return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('')
        }

        function salt() {
          let b = new Uint8Array(16);
          crypto.getRandomValues(b);
          return Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('')
        }
        async function ph(p, s) {
          return sha(s + ':' + p + ':bss')
        }

        function goodPass(p) {
          return p && p.length >= 8 && C.sp.test(p)
        }
        async function audit(action, entity = '', detail = '') {
          if (user) await put('audit', {
            at: now(),
            userId: user.id,
            user: user.name,
            role: user.role,
            action,
            entity,
            detail
          })
        }
        async function seed() {
          let m = await one('meta', 'seeded');
          if (m) return;
          let t = now(),
            users = [];
          for (let x of [
              ['Yasin Ullah Admin', 'admin@madrasa.local', 'admin', 'Admin@123'],
              ['Qari Abdul Basit', 'teacher@madrasa.local', 'teacher', 'Teacher@123'],
              ['Ayesha Fee Clerk', 'clerk@madrasa.local', 'standard', 'Clerk@123'],
              ['Muhammad Wali Viewer', 'user@madrasa.local', 'standard', 'User@123']
            ]) {
            let s = salt();
            users.push({
              name: x[0],
              email: x[1],
              role: x[2],
              salt: s,
              hash: await ph(x[3], s),
              active: true,
              createdAt: t,
              updatedAt: t
            })
          }
          await bulk('users', users);
          await put('settings', {
            key: 'app',
            school: 'Darul Uloom Noor-ul-Huda',
            schoolUrdu: 'دارالعلوم نور الہدیٰ',
            address: 'Main Bazaar, Bannu, Khyber Pakhtunkhwa',
            contact: '0336-1593533',
            lang: 'en',
            prefix: 'BSS-MMS',
            tenant: new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString().slice(0, 10),
            timezone: C.tz,
            updatedAt: t
          });
          await bulk('teachers', [{
            name: 'Qari Abdul Basit',
            subjects: 'Nazra Quran, Hifz, Tajweed',
            mobile: '03001234567',
            salary: 42000,
            appointed: '2022-03-05',
            qualification: 'Dars-e-Nizami, Wifaq ul Madaris certificate',
            status: 'Active',
            photo: '',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Mufti Hamid Ullah',
            subjects: 'Fiqh, Hadith, Arabic Grammar',
            mobile: '03129876543',
            salary: 56000,
            appointed: '2021-08-14',
            qualification: 'Aalim Fazil, Ifta specialization',
            status: 'Active',
            photo: '',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Hafiza Maryam Khan',
            subjects: 'Qaida, Nazra, Urdu',
            mobile: '03451234567',
            salary: 38000,
            appointed: '2023-01-10',
            qualification: 'Hifz Quran, BA Urdu',
            status: 'Active',
            photo: '',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Sir Imran Shah',
            subjects: 'Mathematics, English, Science',
            mobile: '03339876543',
            salary: 45000,
            appointed: '2020-11-20',
            qualification: 'MSc Mathematics, B.Ed',
            status: 'Active',
            photo: '',
            createdAt: t,
            updatedAt: t
          }]);
          let T = await all('teachers');
          await bulk('classes', [{
            name: 'Hifz Level 1',
            teacherId: T[0].id,
            subjects: 'Hifz, Tajweed, Duas',
            fee: 2500,
            room: 'Room A1',
            level: 'Madrasa',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Dars-e-Nizami Year 2',
            teacherId: T[1].id,
            subjects: 'Fiqh, Hadith, Sarf',
            fee: 3200,
            room: 'Room B2',
            level: 'Madrasa',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Primary Grade 4',
            teacherId: T[3].id,
            subjects: 'English, Mathematics, Science, Urdu',
            fee: 3000,
            room: 'Room C4',
            level: 'School',
            createdAt: t,
            updatedAt: t
          }, {
            name: 'Nazra Group Girls',
            teacherId: T[2].id,
            subjects: 'Qaida, Nazra, Urdu',
            fee: 1800,
            room: 'Room G1',
            level: 'Madrasa',
            createdAt: t,
            updatedAt: t
          }]);
          let Cc = await all('classes');
          await bulk('students', [{
            enroll: 'DNH-2026-001',

        function drawCap(c, txt) {
          let x = c.getContext('2d'),
            w = c.width,
            h = c.height;
          x.fillStyle = '#f8fafc';
          x.fillRect(0, 0, w, h);
          for (let i = 0; i < 70; i++) {
            x.fillStyle = `rgba(${Math.random() * 90},${120 + Math.random() * 80},${120 + Math.random() * 80},.32)`;
            x.beginPath();
            x.arc(Math.random() * w, Math.random() * h, Math.random() * 2 + 1, 0, 7);
            x.fill()
          }
          for (let i = 0; i < 6; i++) {
            x.strokeStyle = '#64748b88';
            x.beginPath();
            x.moveTo(Math.random() * w, Math.random() * h);
            x.lineTo(Math.random() * w, Math.random() * h);
            x.stroke()
          }
          x.font = '900 27px monospace';
          x.textAlign = 'center';
          x.textBaseline = 'middle';
          x.fillStyle = '#0f766e';
          x.fillText(txt, w / 2, h / 2)
        }

        function auth(mode = 'login') {
          let pre = id('auth'),
            a = 4 + Math.floor(Math.random() * 15),
            b = 4 + Math.floor(Math.random() * 15),
            op = Math.random() > .35 ? '+' : '-',
            ans = op === '+' ? a + b : a - b,
            is = mode === 'login';
          app().innerHTML = `<main class="min-h-screen auth-bg flex flex-col"><section class="flex-1 flex items-center justify-center p-4"><div class="card max-w-5xl w-full overflow-hidden animate__animated animate__fadeIn"><div class="grid lg:grid-cols-[1fr_1.15fr]"><div class="bg-gradient-to-br from-teal-800 to-emerald-700 p-8 text-white"><div class="mb-6 h-16 w-16 rounded-2xl bg-white/15 flex items-center justify-center text-3xl"><i class="fa-solid fa-mosque"></i></div><h1 class="text-3xl font-black">${esc(settings.school || 'Madrasa Management')}</h1><p class="mt-3 text-white/85">Single HTML IndexedDB app for Madrasa and School Management with receipts, attendance, payroll, reports, backup, RBAC, Urdu/RTL and mobile navigation.</p><div class="mt-8 rounded-2xl bg-white/10 p-4 text-sm"><b>Demo login</b><p>admin@madrasa.local / Admin@123</p><p>teacher@madrasa.local / Teacher@123</p><p>clerk@madrasa.local / Clerk@123</p></div></div><div class="p-6 sm:p-8"><div class="mb-5 flex justify-between gap-3"><div><h2 class="text-2xl font-black text-slate-900">${is ? 'Secure Login' : 'Register Account'}</h2><p class="text-sm text-slate-500">Math CAPTCHA and browser throttling are enabled.</p></div><button class="btn btn-soft" data-auth="${is ? 'register' : 'login'}">${is ? 'Register' : 'Login'}</button></div><form id="${pre}" class="space-y-4" novalidate>${is ? '' : `<div><label>Name</label><input class="form-input" name="name" required autofocus></div>`}<div><label>Email</label><input class="form-input" type="email" name="email" required ${is ? 'autofocus' : ''}></div><div><label>Password</label><input class="form-input" type="password" name="password" required><p class="text-xs text-slate-500 mt-1">Minimum 8 characters with 1 special character.</p></div><div><label>Math CAPTCHA</label><div class="flex gap-3"><canvas id="cap" width="210" height="64" class="rounded-xl border bg-white"></canvas><button type="button" class="btn btn-soft" data-refresh="1"><i class="fa-solid fa-rotate"></i></button></div><input class="form-input mt-2" type="number" name="cap" required></div><button class="btn btn-primary w-full" type="submit"><i class="fa-solid fa-shield"></i>${is ? 'Login' : 'Create Account'}</button></form></div></div></div></section>${footer()}</main>`;
          drawCap($('#cap'), `${a} ${op} ${b}`);
          app().onclick = e => {
            let q = e.target.closest('[data-auth]');
            if (q) auth(q.dataset.auth);
            if (e.target.closest('[data-refresh]')) auth(mode)
          };
          bind('#' + pre, [
            ['email', 'email'],
            ['password', 'pass'],
            ['cap', 'req']
          ].concat(is ? [] : [
            ['name', 'req']
          ]), async f => {
            let stop = loadBtn(f.querySelector('button'));
            try {
              let d = Object.fromEntries(new FormData(f));
              if (+d.cap !== ans) throw Error('CAPTCHA answer is incorrect');
              if (is) await login(d);
              else await register(d)
            } catch (e) {
              toast('error', e.message)
            } finally {
              stop()
            }
          })
        }

        function fails(email) {
          let k = 'mms_fail_' + email,
            r = JSON.parse(localStorage.getItem(k) || '[]').filter(x => Date.now() - x < 900000);
          localStorage.setItem(k, JSON.stringify(r));
          return r
        }

        function fail(email) {
          let r = fails(email);
          r.push(Date.now());
          localStorage.setItem('mms_fail_' + email, JSON.stringify(r))
        }
        async function login(d) {
          let email = d.email.trim().toLowerCase(),
            f = fails(email);
          if (f.length >= 5) throw Error('Too many attempts. Try later.');
          let u = await idx('users', 'email', email);
          if (!u || !u.active) {
            fail(email);
            throw Error('Invalid credentials')
          }
          if (await ph(d.password, u.salt) !== u.hash) {
            fail(email);
            throw Error('Invalid credentials')
          }
          localStorage.removeItem('mms_fail_' + email);
          session = {
            userId: u.id,
            created: Date.now(),
            last: Date.now(),
            csrf: id('csrf')
          };
          localStorage.setItem('mms_session', JSON.stringify(session));
          user = u;
          await loadTheme();
          await audit('Logged in', 'auth', u.email);
          shell();
          route('dashboard', 1);
          watchSession();
          toast('success', 'Welcome back')
        }
        async function register(d) {
          let email = d.email.trim().toLowerCase();
          if (await idx('users', 'email', email)) throw Error('Email already exists');
          if (!goodPass(d.password)) throw Error('Password policy failed');
          let s = salt(),
            uid = await put('users', {
              name: d.name.trim(),
              email,
              role: 'standard',
              salt: s,
              hash: await ph(d.password, s),
              active: true,
              createdAt: now(),
              updatedAt: now()
            });
          user = await one('users', uid);
          session = {
            userId: user.id,
            created: Date.now(),
            last: Date.now(),
            csrf: id('csrf')
          };
          localStorage.setItem('mms_session', JSON.stringify(session));
          await loadTheme();
          await audit('Registered', 'auth', email);
          shell();
          route('dashboard', 1);
          watchSession();
          toast('success', 'Account created')
        }
        async function restore() {
          let s = JSON.parse(localStorage.getItem('mms_session') || 'null');
          if (!s) return false;
          let u = await one('users', s.userId);
          if (!u || !u.active || Date.now() - s.created > C.abs || Date.now() - s.last > C.idle) {
            localStorage.removeItem('mms_session');
            return false
          }
          session = s;
          user = u;
          touch();
          return true
        }

        function touch() {
          if (session) {
            session.last = Date.now();
            localStorage.setItem('mms_session', JSON.stringify(session))
          }
        }
        async function logout(msg = 'Signed out') {
          await audit('Logged out', 'auth', msg);
          user = null;
          session = null;
          localStorage.removeItem('mms_session');
          clearInterval(timer);
          auth('login');
          toast('info', msg)
        }

        function watchSession() {
          clearInterval(timer);
          ['click', 'keydown', 'scroll', 'touchstart'].forEach(e => window.addEventListener(e, touch, {
            passive: true
          }));
          timer = setInterval(() => {
            if (!session) return;
            if (Date.now() - session.last > C.idle) logout('Idle logout after 40 minutes');
            else if (Date.now() - session.created > C.abs) logout('Session expired after 8 hours')
          }, 30000)
        }

        function bind(sel, fields, handler) {
          let f = $(sel);
          if (!f) return;
          let run = async e => {
            e.preventDefault();
            if (f.dataset.busy === '1') return;
            f.dataset.busy = '1';
            try {
              await handler(f, e)
            } finally {
              f.dataset.busy = '0'
            }
          };
          if (window.JustValidate) {
            let v = new JustValidate(sel, {
              validateBeforeSubmitting: true,
              errorLabelCssClass: 'text-red-600 text-xs mt-1 block'
            });
            fields.forEach(x => {
              let n = x[0],
                type = x[1],
                rules = [];
              if (['req', 'email', 'pass', 'number', 'date', 'month', 'select'].includes(type)) rules.push({
                rule: 'required'
              });
              if (type === 'email') rules.push({
                rule: 'email'
              });
              if (type === 'pass') rules.push({
                rule: 'minLength',
                value: 8
              }, {
                validator: v => C.sp.test(v),
                errorMessage: 'Must include a special character'
              });
              if (type === 'number') rules.push({
                rule: 'number'
              }, {
                validator: v => num(v) >= 0,
                errorMessage: 'Must be zero or more'
              });
              if (x[2]) rules.push({
                rule: 'minLength',
                value: x[2]
              });
              let el = f.querySelector(`[name="${n}"]`);
              if (el && rules.length) v.addField(`[name="${n}"]`, rules)
            });
            v.onSuccess(run)

        async function readImage(file) {
          if (!file) return '';
          let ok = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
          if (!ok.includes(file.type)) throw Error('Only JPG, PNG, WEBP or GIF images are allowed');
          let data = await new Promise((res, rej) => {
            let r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = () => rej(Error('Unable to read image'));
            r.readAsDataURL(file)
          });
          if (file.size <= C.imgMax) return data;
          let img = await new Promise((res, rej) => {
            let i = new Image();
            i.onload = () => res(i);
            i.onerror = () => rej(Error('Invalid image file'));
            i.src = data
          });
          let scale = Math.min(1, 900 / Math.max(img.width, img.height)),
            w = Math.max(1, Math.round(img.width * scale)),
            h = Math.max(1, Math.round(img.height * scale)),
            c = document.createElement('canvas'),
            q = .82,
            out;
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          do {
            out = c.toDataURL('image/jpeg', q);
            q -= .08
          } while (out.length * 0.75 > C.imgMax && q > .3);
          if (out.length * 0.75 > C.imgMax) throw Error('Image cannot be compressed under 200KB');
          return out
        }

        async function backup() {
          let data = {
            app: 'BSS Madrasa Management IndexedDB',
            version: C.ver,
            exportedAt: now(),
            author: C.author,
            stores: {}
          };
          for (let s of stores) data.stores[s] = await all(s);
          let blob = new Blob([JSON.stringify(data, null, 2)], {
              type: 'application/json'
            }),
            a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'madrasa-backup-' + today() + '.json';
          a.click();
          URL.revokeObjectURL(a.href);
          await audit('Exported backup', 'settings', 'json');
          toast('success', 'Backup exported')
        }
        async function importBackup(file) {
          if (!file) return;
          try {
            let txt = await file.text(),
              data = JSON.parse(txt);
            if (!data.stores || !stores.every(s => Array.isArray(data.stores[s]))) throw Error('Invalid backup file');
            if (!await ask('Restore backup?', 'This will overwrite current local data.', 'Restore')) return;
            for (let s of stores) await clr(s);
            for (let s of stores) await bulk(s, data.stores[s]);
            await loadSettings();
            await restore();
            await loadTheme();
            shell();
            await go('dashboard', true);
            toast('success', 'Backup restored')
          } catch (e) {
            toast('error', e.message)
          } finally {
            $('#restoreFile').value = ''
          }
        }

          if (await ask('Factory reset?', 'All data will be erased and exactly four realistic seed records per core module will be recreated.', 'Reset')) {
            for (let s of stores) await clr(s);
            localStorage.removeItem('mms_session');
            await seed();
            await loadSettings();
            toast('success', 'System reset');
            auth('login')
          }
        }
        async function openPass() {
          modal('Change Password', `<form id="passForm" class="space-y-4" novalidate><div><label>Current Password</label><input class="form-input" type="password" name="old" required></div><div><label>New Password</label><input class="form-input" type="password" name="password" required><p class="text-xs text-slate-500 mt-1">Minimum 8 characters and at least 1 special character.</p></div><div><label>Confirm New Password</label><input class="form-input" type="password" name="confirm" required></div><div class="flex justify-end gap-2"><button type="button" class="btn btn-soft" data-action="modalClose">Cancel</button><button class="btn btn-primary"><i class="fa-solid fa-key"></i>Update Password</button></div></form>`);
          bind('#passForm', [
            ['old', 'req'],
            ['password', 'pass'],
            ['confirm', 'pass']
          ], async f => {
            let stop = loadBtn(f.querySelector('button[type=submit]'));
            try {
              let d = Object.fromEntries(new FormData(f));
              if (await ph(d.old, user.salt) !== user.hash) throw Error('Current password is incorrect');
              if (d.password !== d.confirm) throw Error('Passwords do not match');
              let s = salt();
              user.salt = s;
              user.hash = await ph(d.password, s);
              user.updatedAt = now();
              await put('users', user);
              await audit('Changed password', 'users', user.email);
              dirty = false;
              await closeModal(true);
              toast('success', 'Password changed')
            } catch (e) {
              toast('error', e.message)
            } finally {
              stop()
            }
          })
        }
        async function openUser(rid = 0) {
          if (!canAdmin()) return toast('error', 'Admin rights required');
          let rec = rid ? await one('users', rid) : {};
          modal((rid ? 'Edit' : 'Add') + ' User', `<form id="userForm" class="grid sm:grid-cols-2 gap-4" novalidate><div><label>Name</label><input class="form-input" name="name" value="${esc(rec.name || '')}" required></div><div><label>Email</label><input class="form-input" type="email" name="email" value="${esc(rec.email || '')}" required></div><div><label>Role</label><select class="form-input" name="role" required><option value="admin" ${rec.role === 'admin' ? 'selected' : ''}>Admin</option><option value="teacher" ${rec.role === 'teacher' ? 'selected' : ''}>Teacher</option><option value="standard" ${rec.role === 'standard' ? 'selected' : ''}>Standard User</option></select></div><div><label>Status</label><select class="form-input" name="active"><option value="1" ${rec.active !== false ? 'selected' : ''}>Active</option><option value="0" ${rec.active === false ? 'selected' : ''}>Inactive</option></select></div><div class="sm:col-span-2"><label>${rid ? 'New Password (leave blank to keep old)' : 'Password'}</label><input class="form-input" type="password" name="password" ${rid ? '' : 'required'}></div><div class="sm:col-span-2 flex justify-end gap-2"><button type="button" class="btn btn-soft" data-action="modalClose">Cancel</button><button class="btn btn-primary">Save User</button></div></form>`);
          bind('#userForm', [
            ['name', 'req'],
            ['email', 'email'],
            ['role', 'select']
          ].concat(rid ? [] : [
            ['password', 'pass']
          ]), async f => {
            let stop = loadBtn(f.querySelector('button[type=submit]'));
            try {
              let d = Object.fromEntries(new FormData(f)),
                email = d.email.trim().toLowerCase(),
                exists = await idx('users', 'email', email).catch(() => null);
              if (exists && exists.id !== rid) throw Error('Email already exists');
              let obj = rid ? rec : {
                createdAt: now()
              };
              Object.assign(obj, {
                name: d.name.trim(),
                email,
                role: d.role,
                active: d.active === '1',
                updatedAt: now()
              });
              if (d.password) {
                if (!goodPass(d.password)) throw Error('Password policy failed');
                let s = salt();
                obj.salt = s;
                obj.hash = await ph(d.password, s)
              }
              await put('users', obj);
              await audit(rid ? 'Updated user' : 'Created user', 'users', email);
              dirty = false;
              await closeModal(true);
              await renderSettings();
              toast('success', 'User saved')
            } catch (e) {
              toast('error', e.message)
            } finally {
              stop()
            }
          })
        }
        async function deleteUser(id) {
          if (!canAdmin()) return toast('error', 'Admin rights required');
          if (id === user.id) return toast('error', 'You cannot delete your own account');
          if (await ask('Delete user?', 'This removes the login account only. Existing audit logs remain.', 'Delete')) {
            await del('users', id);
            await audit('Deleted user', 'users', String(id));
            await renderSettings();
            toast('success', 'User deleted')
          }
        }
        async function deleteCrud(key, rid) {
          if (key === 'feeCollection') {
            if (await ask('Delete fee receipt?', 'This payment record will be removed.', 'Delete')) {
              await del('feePayments', rid);
              await audit('Deleted fee payment', 'feePayments', String(rid));
              await renderFeeCollection();
              toast('success', 'Deleted')
            }
            return
          }
          if (key === 'payroll') {
            if (!canAdmin()) return toast('error', 'Admin rights required');
            if (await ask('Delete salary slip?', 'This payment record will be removed.', 'Delete')) {
              await del('salaryPayments', rid);
              await audit('Deleted salary payment', 'salaryPayments', String(rid));
              await renderPayroll();
              toast('success', 'Deleted')
            }
            return
          }
          let d = defs[key];
          if (!d) return;
          if (!canAdmin()) return toast('error', 'Admin rights required');
          if (await ask('Delete record?', 'This action cannot be undone.', 'Delete')) {
            await del(d.store, rid);
            await audit('Deleted', d.store, String(rid));
            await renderCRUD(key);
            toast('success', 'Record deleted')
          }
        }
        async function render() {
          if (!user) return auth('login');
          if ($('#deskNav')) $('#deskNav').innerHTML = navHtml();
          if ($('#mobileNav')) $('#mobileNav').innerHTML = navHtml(true);
          Object.values(charts).forEach(c => {
            try {
              c.destroy()
            } catch (e) {}
          });
          charts = {};
          main().innerHTML = '<div class="min-h-[50vh] flex items-center justify-center"><div class="card p-6 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-teal-700"></i><p class="mt-2 text-slate-500">Loading module...</p></div></div>';
          try {
            if (mod === 'dashboard') await renderDashboard();
            else if (['students', 'teachers', 'classes', 'fees', 'expenses', 'inventory'].includes(mod)) await renderCRUD(mod);
            else if (mod === 'feeCollection') await renderFeeCollection();
            else if (mod === 'payroll') await renderPayroll();
            else if (mod === 'attendance') await renderAttendance();
            else if (mod === 'exams') await renderExams();
            else if (mod === 'timetable') await renderTimetable();
            else if (mod === 'staffAttendance') await renderStaffAttendance();
            else if (mod === 'reports') await renderReports();
            else if (mod === 'settings') await renderSettings();
            else await renderDashboard();
            await audit('Viewed module', 'navigation', mod)
          } catch (e) {
            main().innerHTML = head('Module Error', 'The app handled the issue without a white screen.') + `<div class="card p-6 text-red-700"><b>${esc(e.message)}</b></div>`
          }
        }
        async function init() {
          try {
            db = await openDB();
            await seed();
            await loadSettings();
            if (await restore()) {
              await loadTheme();
              shell();
              await go(currentRoute(), true);
              watchSession()
            } else {
              await loadTheme();
              auth('login')
            }
          } catch (e) {
            app().innerHTML = `<main class="min-h-screen flex flex-col"><section class="flex-1 flex items-center justify-center p-4"><div class="card p-6 max-w-xl"><h1 class="text-2xl font-black text-red-700">Startup Error</h1><p class="mt-2 text-slate-600">${esc(e.message)}</p><p class="mt-2 text-sm">Please use a modern browser with IndexedDB enabled.</p></div></section>${footer()}</main>`
          }
        }
        document.addEventListener('DOMContentLoaded', init);
      })();
    </script>
  </body>
</html>
